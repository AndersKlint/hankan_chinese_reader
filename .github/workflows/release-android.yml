name: Build Android release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: hankan_chinese_reader

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: hankan_chinese_reader
          persist-credentials: false

      - name: Validate release signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/hankan-release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing required signing secret: ${secret}"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - uses: actions/checkout@v4
        with:
          repository: AndersKlint/flutter_package_chinese_popup_dict
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: chinese_popup_dict
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: AndersKlint/dart_paddle_ocr
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: dart_paddle_ocr
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Android OCR native dependencies
        run: bash "$GITHUB_WORKSPACE/dart_paddle_ocr/android/src/main/cpp/setup_ncnn_deps.sh"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed universal APK
        env:
          REF_NAME: ${{ github.ref_name }}
          TAG_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          if [[ "$TAG_BUILD" == true ]]; then
            version="${REF_NAME#v}"
            build_number="$GITHUB_RUN_NUMBER"
            asset_tag="$REF_NAME"
          else
            pubspec_version=$(python3 -c 'import re; from pathlib import Path; print(re.search(r"^version:\s*(\S+)", Path("pubspec.yaml").read_text(), re.M)[1])')
            version="${pubspec_version%%+*}"
            build_number="${pubspec_version##*+}"
            asset_tag="v${version}"
          fi
          flutter build apk --release --build-name="$version" --build-number="$build_number"
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/HanKan-android-${asset_tag}.apk"
          (cd release-assets && sha256sum -- "HanKan-android-${asset_tag}.apk" > SHA256SUMS-android)

      - uses: actions/upload-artifact@v4
        with:
          name: hankan-android
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ github.workspace }}/hankan_chinese_reader/release-assets/*.apk
            ${{ github.workspace }}/hankan_chinese_reader/release-assets/SHA256SUMS-android

      - name: Remove signing key
        if: always()
        run: rm -f -- "$ANDROID_KEYSTORE_PATH"

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: hankan-release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hankan-android
          path: ${{ github.workspace }}/release-assets

      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: HanKan ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/release-assets/HanKan-android-${{ github.ref_name }}.apk
            ${{ github.workspace }}/release-assets/SHA256SUMS-android
