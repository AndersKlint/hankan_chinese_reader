name: Release Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: hankan_chinese_reader
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: hankan_chinese_reader
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AndersKlint/flutter_package_chinese_popup_dict
          path: chinese_popup_dict
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AndersKlint/dart_paddle_ocr
          path: dart_paddle_ocr
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Install build dependencies and Flatpak runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev flatpak flatpak-builder elfutils
          if ! unshare --user --map-root-user true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          if [[ "$IS_TAG" == true ]]; then
            version="${RELEASE_TAG#v}"
            label="$RELEASE_TAG"
          else
            version=$(python3 -c 'import re; print(re.search(r"^version:\s*([^\s+]+)", open("pubspec.yaml").read(), re.M)[1])')
            label="v$version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          flutter pub get
          make flatpak FLUTTER_BUILD_FLAGS="--build-name=$version --build-number=${{ github.run_number }}"
          mkdir -p dist
          mv hankan_chinese_reader.flatpak "dist/HanKan-linux-x64-$label.flatpak"
          (cd dist && sha256sum -- *.flatpak > SHA256SUMS-linux-x64)
      - uses: actions/upload-artifact@v4
        with:
          name: hankan-linux-x64
          if-no-files-found: error
          compression-level: 0
          path: ${{ github.workspace }}/hankan_chinese_reader/dist/*

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: hankan-release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hankan-linux-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HanKan ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/HanKan-linux-x64-${{ github.ref_name }}.flatpak
            release-assets/SHA256SUMS-linux-x64
