name: hankan_chinese_reader
description: "A Chinese reading assistant with popup dictionary support."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  chinese_popup_dict:
    path: ../chinese_popup_dict
  dart_paddle_ocr:
    path: ../dart_paddle_ocr
  get_it: ^9.3.0
  watch_it: ^2.5.0
  pdfrx: ^2.10.1
  file_picker: ^13.2.0
  google_fonts: ^9.0.0
  logging: ^1.3.0
  image: ^4.12.0
  shared_preferences: ^2.5.6
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

icons_launcher:
  image_path: assets/icon/app_icon.png
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true
    linux:
      enable: true
    windows:
      enable: true
    web:
      enable: true

flutter:
  uses-material-design: true
